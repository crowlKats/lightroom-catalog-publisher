name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 (Lightroom's Lua version)
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Syntax check
        run: |
          for f in catalog-publisher.lrplugin/*.lua; do
            luac5.1 -p "$f"
          done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version from tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! [[ "$tag" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "tag must look like v1.2.3, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          sed -i -E "s/VERSION = \{[^}]*\}/VERSION = { major = ${BASH_REMATCH[1]}, minor = ${BASH_REMATCH[2]}, revision = ${BASH_REMATCH[3]} }/" \
            catalog-publisher.lrplugin/Info.lua
          grep -q "major = ${BASH_REMATCH[1]}, minor = ${BASH_REMATCH[2]}, revision = ${BASH_REMATCH[3]}" \
            catalog-publisher.lrplugin/Info.lua
      - name: Package
        run: |
          mkdir dist
          zip -r "dist/catalog-publisher-${GITHUB_REF_NAME}.lrplugin.zip" catalog-publisher.lrplugin -x '*.DS_Store'
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "$GITHUB_REF_NAME" --generate-notes
